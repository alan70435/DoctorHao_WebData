<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><defs><linearGradient id="bone"><stop stop-color="#fff4cf"/><stop offset=".55" stop-color="#d7c399"/><stop offset="1" stop-color="#817157"/></linearGradient></defs><rect width="1600" height="1000" fill="#081722"/><text x="70" y="90" fill="white" font-size="52" font-family="sans-serif" font-weight="700">體操選手手腕：承重與生長板壓力</text><text x="70" y="140" fill="#a6c9dc" font-size="28" font-family="sans-serif">年輕選手需特別留意遠端橈骨生長板與慢性過度使用</text><g transform="translate(240 190)"><path d="M260 20 C210 170 210 380 240 590 L300 760 L420 760 L470 590 C500 380 500 170 445 20Z" fill="url(#bone)"/><path d="M520 50 C490 210 500 410 525 610 L565 760 L650 760 L690 600 C710 390 700 200 665 50Z" fill="url(#bone)"/><rect x="235" y="575" width="240" height="32" rx="16" fill="#ff6e78"/><text x="40" y="595" fill="#ff9ca3" font-size="28" font-family="sans-serif" font-weight="700">遠端橈骨生長板</text><line x1="225" y1="590" x2="145" y2="590" stroke="#ff9ca3" stroke-width="5"/><g transform="translate(220 750)"><ellipse cx="260" cy="70" rx="260" ry="75" fill="#d5a17d"/><path d="M80 65 L440 65" stroke="#a86f55" stroke-width="24" stroke-linecap="round"/></g><path d="M350 900 L350 790" stroke="#ffd45c" stroke-width="20"/><path d="M600 900 L600 790" stroke="#ffd45c" stroke-width="20"/><text x="700" y="850" fill="#ffd45c" font-size="28" font-family="sans-serif">手部承重反作用力 ↑</text></g><g transform="translate(970 260)" font-family="sans-serif"><rect width="500" height="430" rx="30" fill="#102a3a" stroke="#37657e"/><text x="30" y="62" fill="white" font-size="31" font-weight="700">常見需留意的區域</text><text x="30" y="125" fill="#cce8f5" font-size="25">• 生長板過度使用傷害</text><text x="30" y="180" fill="#cce8f5" font-size="25">• TFCC / 尺側手腕疼痛</text><text x="30" y="235" fill="#cce8f5" font-size="25">• 舟狀骨壓力性傷害</text><text x="30" y="290" fill="#cce8f5" font-size="25">• 關節囊與肌腱問題</text><text x="30" y="365" fill="#8fe1bc" font-size="23">疼痛持續、腫脹、活動受限時應評估</text></g><text x="70" y="955" fill="#829bb0" font-size="22" font-family="sans-serif">概念性解剖衛教圖，不取代臨床診斷或影像檢查</text></svg>