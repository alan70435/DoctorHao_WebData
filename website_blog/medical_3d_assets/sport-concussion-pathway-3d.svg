<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><rect width="1600" height="1000" fill="#081723"/><text x="70" y="90" fill="white" font-size="52" font-family="sans-serif" font-weight="700">運動性腦震盪：辨識、退場、再評估、恢復</text><text x="70" y="140" fill="#a7c9db" font-size="28" font-family="sans-serif">診斷以臨床綜合評估為核心；不是靠單一影像檢查</text><g transform="translate(100 250)" font-family="sans-serif"><circle cx="180" cy="170" r="150" fill="#253e50"/><path d="M115 105 C160 35 275 70 290 155 C300 225 245 285 170 275 C105 265 75 190 115 105Z" fill="#d9a7a7"/><path d="M125 145 C165 110 205 125 225 160 C255 120 290 155 275 195 C250 255 155 250 120 205 C105 185 110 160 125 145Z" fill="#efc5c5"/><path d="M15 65 L110 125" stroke="#ff6b65" stroke-width="24"/><text x="0" y="360" fill="#ffaaa5" font-size="26" font-weight="700">頭部直接或間接受力</text><g transform="translate(430 0)"><rect width="950" height="430" rx="35" fill="#102b3b" stroke="#37677f"/><text x="35" y="65" fill="white" font-size="32" font-weight="700">場邊流程</text><g font-size="26"><text x="45" y="130" fill="#ffb1ad">1  Recognise｜辨識紅旗、症狀、平衡與認知異常</text><text x="45" y="190" fill="#ffd88c">2  Remove｜疑似腦震盪立即停止參賽</text><text x="45" y="250" fill="#b9e7f4">3  Re-evaluate｜完整神經學、認知、眼球、前庭、步態平衡評估</text><text x="45" y="310" fill="#b8efd5">4  Relative rest｜急性期短暫相對休息，再循序增加活動</text><text x="45" y="370" fill="white">當天確診腦震盪：不得回場比賽</text></g></g><g transform="translate(430 500)"><rect width="950" height="220" rx="30" fill="#201f2b" stroke="#695f8c"/><text x="35" y="60" fill="white" font-size="30" font-weight="700">需要立即升級處置的警訊</text><text x="35" y="115" fill="#e3d9ff" font-size="24">意識惡化、持續嘔吐、抽搐、局部神經缺損、嚴重或加劇頭痛、疑頸椎傷</text><text x="35" y="170" fill="#b8efd5" font-size="23">回場應採分階段流程，並依症狀與醫療專業判斷調整</text></g></g><text x="70" y="955" fill="#829bb0" font-size="22" font-family="sans-serif">衛教示意；急性頭部外傷如有危險徵象應立即接受緊急醫療評估</text></svg>