<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142c3d"/><stop offset="1" stop-color="#071018"/></linearGradient><linearGradient id="skin"><stop stop-color="#f2c7a5"/><stop offset="1" stop-color="#9d674d"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="70" y="90" fill="white" font-size="52" font-family="sans-serif" font-weight="700">落地機制：直膝 vs. 髖膝屈曲吸震</text><text x="70" y="140" fill="#a9c8df" font-size="28" font-family="sans-serif">概念性 3D 動作解說</text><line x1="800" y1="190" x2="800" y2="900" stroke="#35556a" stroke-width="3"/><text x="250" y="215" fill="#ff8b85" font-size="38" font-family="sans-serif" font-weight="700">高風險模式</text><text x="1020" y="215" fill="#7ce0b7" font-size="38" font-family="sans-serif" font-weight="700">較佳吸震模式</text><g stroke="url(#skin)" stroke-width="48" stroke-linecap="round" fill="none"><path d="M390 300 L420 500 L430 690 L445 850"/><path d="M1130 300 L1080 500 L980 655 L1080 820"/></g><g fill="url(#skin)"><circle cx="390" cy="270" r="52"/><circle cx="1130" cy="270" r="52"/></g><g stroke="#dcebf4" stroke-width="20" fill="none"><path d="M350 360 L470 360"/><path d="M1070 360 L1190 360"/></g><path d="M445 875 L445 760" stroke="#ff625b" stroke-width="22"/><path d="M1080 875 L1040 760" stroke="#7ce0b7" stroke-width="22"/><text x="120" y="520" fill="white" font-size="28" font-family="sans-serif">膝接近伸直</text><text x="120" y="560" fill="#ffaaa5" font-size="25" font-family="sans-serif">地面反作用力較集中</text><text x="940" y="520" fill="white" font-size="28" font-family="sans-serif">髖、膝共同屈曲</text><text x="940" y="560" fill="#b7efd7" font-size="25" font-family="sans-serif">臀肌、股四頭肌、腿後肌協助減速</text><rect x="90" y="700" width="560" height="150" rx="26" fill="#251d22" stroke="#9f4f4a"/><text x="120" y="755" fill="#ffb1ac" font-size="28" font-family="sans-serif">避免：直膝、單腳、軀幹失控</text><text x="120" y="805" fill="white" font-size="24" font-family="sans-serif">尤其合併碰撞或旋轉外力時</text><rect x="900" y="700" width="590" height="150" rx="26" fill="#102a25" stroke="#3c8f72"/><text x="930" y="755" fill="#b7efd7" font-size="28" font-family="sans-serif">目標：柔和、穩定、可控制的落地</text><text x="930" y="805" fill="white" font-size="24" font-family="sans-serif">訓練動作可包含深蹲、硬舉、分腿蹲</text><text x="70" y="955" fill="#829bb0" font-size="22" font-family="sans-serif">衛教示意，不代表單一動作必然造成傷害</text></svg>